<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>¿BUEN TURISTA?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Nunito+Sans:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: juego de clase en un proyector, alegre, frases muy simples
   IDEA: el árbitro de fútbol: cada turista recibe una tarjeta
   PICTURE: una escena ilustrada de la isla por turista (moái, playa, parque…)
   COLOUR and TYPE: océano profundo, tarjetas verde/amarilla/roja; Unbounded + Nunito Sans
   LAYOUT: escena grande arriba o a la izquierda, frase grande, tres tarjetas enormes */
:root{color-scheme:light dark;--bg:light-dark(#0b5d7a,#07384a);--paper:light-dark(#fffaf0,#14232a);--ink:light-dark(#18232a,#eef3f2);--mute:light-dark(#4f5d66,#a9b8bc);--g:#22a05a;--y:#f5c518;--r:#d7263d;--sun:#f5b82e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.45 'Nunito Sans',system-ui,sans-serif;min-height:100vh;overflow-x:clip}
.wrap{max-width:1400px;margin:0 auto;padding:clamp(16px,2.5vw,32px)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;color:#fff;margin-bottom:18px}
h1{font:900 clamp(26px,3.4vw,46px)/1.05 Unbounded,sans-serif;margin:0}
h1 span{color:var(--sun)}
.prog{display:flex;gap:8px}
.prog i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25)}
.prog i.done{background:var(--sun)}.prog i.now{background:#fff}
.card{background:var(--paper);border-radius:28px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.scene{background:#bfe6f5;min-height:420px;position:relative}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.side{padding:clamp(22px,3vw,44px);display:flex;flex-direction:column;gap:20px}
.who{font-weight:900;color:var(--mute);margin:0;font-size:20px}
.sit{font:900 clamp(28px,3vw,44px)/1.15 'Nunito Sans',sans-serif;margin:0;text-wrap:balance}
.q{font:700 clamp(22px,2vw,28px)/1.2 Unbounded,sans-serif;margin:0;color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cards button{border:0;border-radius:18px;padding:16px 10px;cursor:pointer;color:#fff;font:900 20px/1.15 'Nunito Sans',sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .15s}
.cards button b{font:900 26px Unbounded,sans-serif}
.cards button:hover,.cards button:focus-visible{transform:translateY(-4px);outline:4px solid var(--ink);outline-offset:3px}
.cards .g{background:var(--g)}.cards .y{background:var(--y);color:#2b2200}.cards .r{background:var(--r)}
.hint{font-size:16px;color:var(--mute);margin:0}
.res{display:flex;flex-direction:column;gap:14px;animation:pop .4s ease}
.verdict{display:flex;align-items:center;gap:18px}
.bigcard{width:86px;height:118px;border-radius:12px;flex:none;box-shadow:0 6px 0 rgba(0,0,0,.25);transform:rotate(-8deg)}
.verdict p{margin:0;font:900 clamp(30px,3.2vw,48px)/1.05 Unbounded,sans-serif}
.ok{font-weight:900;font-size:24px;margin:0}
.why{font-size:clamp(22px,2vw,28px);font-weight:800;margin:0}
.fact{font-size:19px;color:var(--mute);margin:0;padding:12px 16px;border-left:6px solid var(--sun);background:light-dark(#fff3d6,#22333a);border-radius:8px}
.nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:auto}
.btn{border:0;border-radius:16px;min-height:60px;padding:0 26px;font:900 22px 'Nunito Sans',sans-serif;cursor:pointer;background:#18232a;color:#fff}
:root[data-theme=dark] .btn{background:var(--sun);color:#1b1b1b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{background:var(--sun);color:#1b1b1b}}
.btn.ghost{background:transparent;color:var(--ink);outline:3px solid currentColor;outline-offset:-3px}
.btn:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:8px 0}
.rule{border-radius:20px;padding:22px;color:#fff;display:flex;flex-direction:column;gap:8px}
.rule b{font:900 28px Unbounded,sans-serif}.rule span{font-size:22px;font-weight:800}
.rule.g{background:var(--g)}.rule.y{background:var(--y);color:#2b2200}.rule.r{background:var(--r)}
.intro{background:var(--paper);border-radius:28px;padding:clamp(24px,4vw,56px);display:flex;flex-direction:column;gap:22px}
.intro h2{font:900 clamp(32px,4vw,58px)/1.05 Unbounded,sans-serif;margin:0}
.intro p{margin:0;font-size:clamp(22px,2vw,28px);font-weight:800}
footer{color:rgba(255,255,255,.75);font-size:15px;margin-top:14px}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){.card{grid-template-columns:minmax(0,1fr)}.scene{min-height:300px}.rules{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){.cards button{min-height:110px;font-size:16px}.cards button b{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>¿Turista <span>responsable?</span></h1><div class="prog" id="prog" aria-label="Progreso"></div></header>
<main id="app" aria-live="polite"></main>
<footer>Teclado: 1 verde · 2 amarilla · 3 roja · Enter o → siguiente</footer>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="moai" viewBox="0 0 60 130"><path d="M10 18 Q10 2 30 2 Q50 2 50 18 L52 60 Q54 66 48 68 L50 128 H10 L12 68 Q6 66 8 60 Z" fill="#4a4038"/><path d="M14 30 H46 V38 H14Z" fill="#3a322c"/><path d="M27 38 L24 58 H36 L33 38Z" fill="#5a4e44"/><path d="M20 70 H40" stroke="#3a322c" stroke-width="4"/><rect x="8" y="0" width="44" height="8" rx="3" fill="#8b3a2b"/></symbol>
<symbol id="pers" viewBox="0 0 40 100"><circle cx="20" cy="14" r="11" fill="#f2c9a0"/><path d="M8 30 Q20 24 32 30 L34 62 H6Z" fill="currentColor"/><path d="M10 62 L8 98 M30 62 L32 98" stroke="#2d3a4a" stroke-width="7" stroke-linecap="round"/><path d="M8 34 L0 58 M32 34 L40 58" stroke="#f2c9a0" stroke-width="6" stroke-linecap="round"/></symbol>
</defs>
</svg>
<script>
{
const C={
g:{cls:'g',name:'VERDE',txt:'¡Bien!',col:'var(--g)'},
y:{cls:'y',name:'AMARILLA',txt:'Cuidado…',col:'var(--y)'},
r:{cls:'r',name:'ROJA',txt:'¡Muy mal!',col:'var(--r)'}
};
const bg=(ground='#7fb24a',extra='')=>`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3f4"/><stop offset="1" stop-color="#e9f7fd"/></linearGradient></defs><rect width="800" height="500" fill="url(#sky)"/><circle cx="590" cy="80" r="42" fill="#ffd45a"/><path d="M0 300 H800 V500 H0Z" fill="#2a8fb8"/><path d="M0 300 Q200 286 400 300 T800 300" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="4"/>${extra}<path d="M0 340 Q180 280 420 320 T800 330 V500 H0Z" fill="${ground}"/>`;
const T=[
{name:'Ali',sit:'Ali se sube a un moái para hacer una foto.',ans:'r',why:'Los moái son sagrados y frágiles. ¡No se tocan!',fact:'En 2022, un incendio ya dañó unos 80 moái.',
scene:bg('#7fb24a')+`<use href="#moai" x="300" y="130" width="120" height="260"/><use href="#moai" x="460" y="170" width="90" height="200"/><use href="#moai" x="170" y="185" width="80" height="180"/><g transform="translate(330 70) rotate(-12)" color="#e8572f"><use href="#pers" width="60" height="150"/></g><rect x="420" y="80" width="54" height="40" rx="6" fill="#222"/><circle cx="447" cy="100" r="11" fill="#6cc"/><text x="490" y="70" font-family="Nunito Sans" font-weight="900" font-size="40" fill="#d7263d">!</text>`},
{name:'Elisa',sit:'Elisa deja su botella de plástico en la playa.',ans:'r',why:'La basura no puede salir fácilmente de la isla.',fact:'En 2016, la isla ya tenía casi 7.500 toneladas de basura.',
scene:bg('#f1dca7')+`<path d="M0 380 Q300 360 800 390 V500 H0Z" fill="#ead19a"/><g transform="translate(250 220)" color="#7a4fd6"><use href="#pers" width="70" height="175"/></g><g transform="translate(420 370) rotate(70)"><rect x="0" y="0" width="34" height="90" rx="10" fill="#9fd6f2" stroke="#4aa3cf" stroke-width="4"/><rect x="9" y="-14" width="16" height="18" fill="#2f7fb3"/></g><path d="M520 410 l20 -10 l10 20 z M580 430 l24 -6 l2 18z" fill="#c9c9c9"/><use href="#moai" x="640" y="200" width="70" height="160"/>`},
{name:'Tom',sit:'Tom visita el parque con un guía rapanui.',ans:'g',why:'Es obligatorio, y el dinero ayuda a la comunidad.',fact:'Desde 2017, los rapanui gestionan el Parque Nacional.',
scene:bg('#7fb24a')+`<use href="#moai" x="520" y="150" width="100" height="230"/><use href="#moai" x="640" y="180" width="80" height="190"/><g transform="translate(160 220)" color="#22a05a"><use href="#pers" width="66" height="165"/></g><path d="M222 130 V240" stroke="#5a3b1e" stroke-width="6"/><path d="M222 130 L290 148 L222 166Z" fill="#f5b82e"/><g transform="translate(270 250)" color="#2f6fd6"><use href="#pers" width="56" height="140"/></g><g transform="translate(340 255)" color="#e8572f"><use href="#pers" width="54" height="135"/></g><g transform="translate(405 262)" color="#b13fa0"><use href="#pers" width="50" height="128"/></g>`},
{name:'Zélie',sit:'Zélie visita toda la isla en solo 2 días.',ans:'y',why:'No está prohibido, pero es mejor quedarse más tiempo.',fact:'La ley permite 30 días como máximo… pero no limita el número de turistas.',
scene:bg('#7fb24a')+`<rect x="130" y="120" width="230" height="230" rx="18" fill="#fff" stroke="#18232a" stroke-width="6"/><rect x="130" y="120" width="230" height="56" rx="18" fill="#d7263d"/><text x="245" y="300" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="120" fill="#18232a">2</text><text x="245" y="160" text-anchor="middle" font-family="Nunito Sans" font-weight="900" font-size="30" fill="#fff">DÍAS</text><g transform="translate(470 200)" color="#f5b82e"><use href="#pers" width="70" height="175"/></g><rect x="555" y="300" width="80" height="80" rx="10" fill="#7a4fd6"/><path d="M575 300 V285 H615 V300" fill="none" stroke="#18232a" stroke-width="6"/><use href="#moai" x="680" y="210" width="60" height="140"/>`},
{name:'Mathieu',sit:'Mathieu duerme en la casa de una familia rapanui y come en su restaurante.',ans:'g',why:'Así, el dinero del turismo se queda en la isla.',fact:'Casi el 90 % de la población vive del turismo.',
scene:bg('#7fb24a')+`<path d="M170 250 L300 160 L430 250Z" fill="#c0573b"/><rect x="190" y="250" width="220" height="130" fill="#fff4dc"/><rect x="280" y="300" width="46" height="80" fill="#8a5a33"/><rect x="210" y="280" width="50" height="40" fill="#8fd3f4"/><rect x="345" y="280" width="50" height="40" fill="#8fd3f4"/><g transform="translate(470 230)" color="#2f6fd6"><use href="#pers" width="62" height="155"/></g><g transform="translate(545 240)" color="#22a05a"><use href="#pers" width="58" height="145"/></g><g transform="translate(615 270)" color="#e8572f"><use href="#pers" width="46" height="115"/></g><path d="M560 150 q20 -30 40 0 q20 -30 40 0 q0 30 -40 50 q-40 -20 -40 -50z" fill="#d7263d"/>`},
{name:'Señora Salazar Delgado',sit:'La señora Salazar Delgado se ducha 30 minutos cada día.',ans:'y',why:'En la isla llueve cada vez menos: el agua es escasa.',fact:'Las lluvias bajaron casi un 24 % entre 1991 y 2020.',
scene:bg('#7fb24a')+`<rect x="230" y="90" width="300" height="300" rx="20" fill="#e9f3f7" stroke="#9ab" stroke-width="6"/><path d="M380 110 V150" stroke="#888" stroke-width="10"/><ellipse cx="380" cy="160" rx="50" ry="14" fill="#888"/>${Array.from({length:14},(_,i)=>`<path d="M${340+(i%7)*13} ${185+Math.floor(i/7)*40} v22" stroke="#2a8fb8" stroke-width="6" stroke-linecap="round"/>`).join('')}<g transform="translate(350 250)" color="#f2c9a0"><use href="#pers" width="58" height="140"/></g><circle cx="610" cy="200" r="60" fill="#fff" stroke="#18232a" stroke-width="6"/><path d="M610 200 V160 M610 200 L640 215" stroke="#18232a" stroke-width="6" stroke-linecap="round"/><text x="610" y="300" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="34" fill="#18232a">30 min</text>`}
];
let i=-1,vote=null,shown=false,score=0,done=0;
const app=document.getElementById('app'),prog=document.getElementById('prog');
function drawProg(){prog.innerHTML=T.map((_,k)=>`<i class="${k<i?'done':k===i?'now':''}"></i>`).join('')}
function intro(){
app.innerHTML=`<section class="intro"><h2>Ustedes son el árbitro</h2><p>Les presento a unos turistas en Rapa Nui. Para cada turista, ustedes deciden: ¿es un turista responsable?</p>
<div class="rules"><div class="rule g"><b>VERDE</b><span>¡Bien! Es un turista responsable.</span></div><div class="rule y"><b>AMARILLA</b><span>Cuidado… no está muy bien.</span></div><div class="rule r"><b>ROJA</b><span>¡Muy mal! ¡Fuera de la isla!</span></div></div>
<div class="nav"><button class="btn" id="go">¡Empezar! →</button></div></section>`;
document.getElementById('go').onclick=()=>{i=0;render()};drawProg();
}
function render(){
drawProg();
if(i>=T.length){end();return}
const t=T[i],a=C[t.ans];
let right;
if(!shown){
right=`<p class="who">Turista ${i+1} de ${T.length}</p><p class="sit">${t.sit}</p><p class="q">¿Qué tarjeta le dan?</p>
<div class="cards">${['g','y','r'].map((c,n)=>`<button class="${c}" data-v="${c}"><b>${C[c].name}</b>${C[c].txt}</button>`).join('')}</div>
<p class="hint">La clase vota con la mano. Haz clic en la tarjeta que tiene más votos.</p>`;
}else{
const good=vote===t.ans;
right=`<p class="who">Turista ${i+1} de ${T.length} · ${t.name}</p>
<div class="res"><div class="verdict"><span class="bigcard" style="background:${a.col}"></span><p>¡Tarjeta ${a.name.toLowerCase()}!</p></div>
${vote?`<p class="ok" style="color:${good?'var(--g)':'var(--r)'}">${good?'✔ ¡La clase tiene razón!':'✘ La clase se equivocó.'}</p>`:''}
<p class="why">${t.why}</p><p class="fact">${t.fact}</p></div>
<div class="nav"><button class="btn" id="next">${i===T.length-1?'Ver el resultado →':'Siguiente turista →'}</button><button class="btn ghost" id="stop">Terminar</button></div>`;
}
app.innerHTML=`<section class="card"><div class="scene"><svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${t.sit}">${t.scene}</svg></div><div class="side">${right}</div></section>`;
if(!shown){app.querySelectorAll('.cards button').forEach(b=>b.onclick=()=>pick(b.dataset.v))}
else{document.getElementById('next').onclick=next;document.getElementById('stop').onclick=end}
}
function pick(v){if(shown)return;vote=v;shown=true;done++;if(v===T[i].ans)score++;render()}
function next(){i++;vote=null;shown=false;render()}
function end(){
i=T.length;drawProg();
const msg=done===0?'¡Gracias, árbitros!':score===done?'¡Perfecto! Son árbitros muy responsables.':score>=done/2?'¡Bien! Pero Rapa Nui necesita reglas claras.':'¡Ay! Rapa Nui necesita límites.';
app.innerHTML=`<section class="intro"><h2>${done?`${score} / ${done} respuestas correctas`:'Fin del juego'}</h2><p>${msg}</p><p>El problema no es el turismo… sino cuánto turismo y quién lo controla.</p><div class="nav"><button class="btn ghost" id="again">Volver a empezar</button></div></section>`;
document.getElementById('again').onclick=()=>{i=-1;score=0;done=0;vote=null;shown=false;intro()};
}
document.addEventListener('keydown',e=>{
if(i<0||i>=T.length)return;
const m={'1':'g','2':'y','3':'r'}[e.key];
if(m&&!shown){pick(m);return}
if(shown&&(e.key==='Enter'||e.key==='ArrowRight')&&!e.target.closest('button')){next()}
});
intro();
}
</script>
</body>
</html>
